name: Focused cache policy verification
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout candidate
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin "$GITHUB_SHA" main:refs/remotes/origin/main
          git checkout --detach "$GITHUB_SHA"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install
      - name: Format candidate and save patch
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/fork-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-policy-format-fixes
          path: ${{ runner.temp }}/fork-format.patch
      - name: Check server types
        working-directory: apps/server
        run: vp run typecheck
      - name: Exercise policy changes and dispatch
        if: ${{ !cancelled() }}
        working-directory: apps/server
        run: vp test run src/orchestration-v2/ThreadCachePolicyService.test.ts src/orchestration-v2/ThreadCachePolicyDispatch.test.ts src/orchestration-v2/CacheWarmingDispatch.integration.test.ts src/orchestration-v2/Adapters/ClaudeAdapterV2.idleCachePolicy.test.ts
      - name: Exercise settings compatibility
        if: ${{ !cancelled() }}
        working-directory: packages/shared
        run: vp test run src/threadCachePolicy.test.ts src/serverSettings.test.ts
      - name: Install headless Chromium
        if: ${{ !cancelled() }}
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Check web types
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: vp run typecheck
      - name: Exercise cache menus
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: vp test run src/components/ThreadCachePolicyControl.browser.test.tsx src/components/threadCachePolicyContextMenu.test.ts
