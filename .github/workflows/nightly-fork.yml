name: Nightly fork release

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after validation; leave off for a dry run"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-fork-release
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  check:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout nightly candidate without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --tags origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$CHECKOUT_REF" ]]
          git fetch --tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
      - name: Select an unreleased commit and unused EK version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fork-nightly-release.py > "$RUNNER_TEMP/nightly-plan.json"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/nightly-plan.json" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/nightly-plan.json" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.plan.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - if: steps.plan.outputs.changed == 'true'
        run: vp install
      - name: Install headless Chromium
        if: steps.plan.outputs.changed == 'true'
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Validate the exact nightly candidate
        if: steps.plan.outputs.changed == 'true'
        run: scripts/fork-upstream-sync.sh checks

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # This runner executes no repository code and only tags the checked commit.
      - name: Tag the checked commit and dispatch the platform builds
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          CHECKED_SHA: ${{ needs.check.outputs.sha }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          [[ "$CHECKED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ek\.[0-9]+$ ]]
          [[ -n "$SYNC_TOKEN" ]] || { echo 'UPSTREAM_SYNC_TOKEN is required to push the annotated tag.'; exit 1; }
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$CHECKED_SHA"
          git config user.name "t3code-ek nightly release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" "$CHECKED_SHA" -m "Nightly T3 Code EK $RELEASE_VERSION"
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$RELEASE_VERSION"
          gh workflow run release-fork.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$RELEASE_VERSION" -f commit="$CHECKED_SHA" -f nightly=true -f publish=true
          printf 'Dispatched nightly %s from %s.\n' "$RELEASE_VERSION" "$CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
