name: Fork device commands

on:
  workflow_dispatch:
  push:
    branches: [main, feat/device-commands, feat/device-utilities]
    paths:
      - ".github/workflows/fork-device-commands.yml"
      - "apps/desktop/src/deviceCommands/**"
      - "apps/desktop/src/deviceUtilities/**"
      - "apps/web/src/deviceUtilities/**"
      - "apps/mobile/src/features/device-utilities/**"
      - "packages/contracts/src/deviceUtilities*"
      - "apps/mobile/modules/t3-native-controls/android/src/main/java/expo/modules/t3nativecontrols/UtilityNavigationIcon.kt"
      - "apps/desktop/src/preload.ts"
      - "apps/desktop/src/ipc/DesktopIpcHandlers.ts"
      - "apps/web/src/deviceCommands/**"
      - "apps/web/src/routes/settings.commands.tsx"
      - "apps/web/src/components/CommandPalette.tsx"
      - "apps/web/src/components/sidebar/SidebarChrome.tsx"
      - "apps/mobile/src/features/device-commands/**"
      - "apps/mobile/modules/t3-termux-command/**"
      - "apps/mobile/modules/t3-native-controls/android/src/main/java/expo/modules/t3nativecontrols/T3WorkspaceNavigationModule.kt"
      - "apps/mobile/src/features/workspace/**"
      - "packages/contracts/src/deviceCommands*"
      - "packages/contracts/src/ipc.ts"

permissions:
  contents: read

concurrency:
  group: device-commands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      APP_VARIANT: development
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - id: install
        run: vp install
      - name: Typecheck changed packages
        run: |
          status=0
          for package in packages/contracts apps/desktop apps/web apps/mobile; do
            (cd "$package" && vp run typecheck) || status=1
          done
          exit "$status"
      - name: Focused tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          vp test run packages/contracts/src/deviceUtilities.test.ts packages/contracts/src/deviceCommands.test.ts apps/mobile/src/features/device-commands/termuxCommands.logic.test.ts apps/mobile/src/features/workspace/workspace-tabs-state.test.ts
          (cd apps/desktop && vp test run src/deviceCommands/DeviceCommandsRunner.test.ts src/deviceCommands/deviceCommandsFile.test.ts src/deviceUtilities/DeviceUtilitiesRuntime.test.ts src/deviceUtilities/UtilityProcessRunner.test.ts)
          (cd apps/web && vp test run --project unit src/deviceCommands/deviceCommands.logic.test.ts)
      - name: Lint feature code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vp lint apps/desktop/src/deviceUtilities apps/web/src/deviceUtilities apps/mobile/src/features/device-utilities packages/contracts/src/deviceUtilities.ts packages/contracts/src/deviceUtilities.test.ts apps/desktop/src/deviceCommands apps/web/src/deviceCommands apps/web/src/routes/settings.commands.tsx apps/mobile/src/features/device-commands packages/contracts/src/deviceCommands.ts packages/contracts/src/deviceCommands.test.ts
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate isolated Android project
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/mobile
        run: vp exec expo prebuild --platform android --no-install
      - name: Test Termux result handling
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/mobile/android
        run: ./gradlew :t3-termux-command:testDebugUnitTest :t3-native-controls:compileDebugKotlin --no-daemon --max-workers=2
