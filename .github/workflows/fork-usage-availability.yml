name: Fork usage availability

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fork-usage-availability.yml"
      - "apps/web/src/usageCompact/**"
      - "scripts/fork-usage-baseline*"
      - "apps/web/src/components/usage/UsageLimitsPooled.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-availability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Keep full test coverage while limiting concurrent browser/worker memory.
      VITEST_MAX_WORKERS: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CHECK_CHANGED_TIMEOUT: "1800"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
      - uses: ./.github/actions/setup-ci-deps
      - uses: ./.github/actions/setup-fork-chromium
      - name: Capture the previous usage displays
        run: |
          python3 scripts/fork-usage-baseline.test.py
          mkdir -p .t3/usage-availability-evidence
          compact=apps/web/src/usageCompact/CompactUsageControl.tsx
          pooled=apps/web/src/components/usage/UsageLimitsPooled.tsx
          # Last revision before the header overlap fix in PR #124.
          usage_baseline=71513acb68b6511217b4efab047b038b73a1da2f
          cp "$compact" "$RUNNER_TEMP/CompactUsageControl.tsx"
          cp "$pooled" "$RUNNER_TEMP/UsageLimitsPooled.tsx"
          trap 'cp "$RUNNER_TEMP/CompactUsageControl.tsx" "$compact"; cp "$RUNNER_TEMP/UsageLimitsPooled.tsx" "$pooled"' EXIT
          git show "$usage_baseline:$compact" > "$compact"
          git show "$usage_baseline:$pooled" > "$pooled"
          # Preserve the historical UI body; adapt only helpers moved by upstream i18n.
          python3 scripts/fork-usage-baseline.py "$compact" "$pooled"
          app_test=apps/web/src/usageCompact/UsageAvailability.app.browser.test.tsx
          VITE_USAGE_AVAILABILITY_CAPTURE=before vp test run "$app_test" -t 'shows read-only resets'
          # The previous control left a fixed header reserve, so a wide usage group overlaps the title.
          if VITE_USAGE_AVAILABILITY_CAPTURE=before vp test run "$app_test" -t 'keeps the thread header clear' > "$RUNNER_TEMP/header-overlap-before.log" 2>&1; then
            cat "$RUNNER_TEMP/header-overlap-before.log"
            echo 'The header overlap check must fail on the previous usage control.'
            exit 1
          fi
          cat "$RUNNER_TEMP/header-overlap-before.log"
          grep -q 'HEADER_USAGE_OVERLAP' "$RUNNER_TEMP/header-overlap-before.log"
      - name: Check changed code
        run: vp run check:changed origin/main
      - name: Verify usage in the complete client and capture results
        run: VITE_USAGE_AVAILABILITY_CAPTURE=after vp test run apps/web/src/usageCompact/UsageAvailability.app.browser.test.tsx
      - name: Check fork footprint
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          python3 scripts/fork-footprint-budget.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: usage-availability-before-after
          path: .t3/usage-availability-evidence/*.png
          include-hidden-files: true
          retention-days: 14
