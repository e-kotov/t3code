name: Fork phone sharing

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fork-phone-sharing.yml"
      - ".github/actions/build-fork-tailnet/**"
      - "scripts/build-tailnet-android.sh"
      - "scripts/fork-sharing-tests.gradle"
      - "apps/mobile/modules/t3-tailnet/**"
      - "apps/mobile/src/features/built-in-tailnet/**"

permissions:
  contents: read

concurrency:
  group: phone-sharing-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CHECK_CHANGED_TIMEOUT: "1800"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
      - name: Check fork footprint
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          python3 scripts/fork-footprint-budget.py
      - name: Check whether Tailscale Go sources changed
        id: tailnet_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet origin/main...HEAD -- apps/mobile/modules/t3-tailnet/go scripts/build-tailnet-android.sh .github/actions/build-fork-tailnet; then
            echo "verify_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "verify_go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/build-fork-tailnet
        with:
          verify-go: ${{ steps.tailnet_changes.outputs.verify_go }}
      - uses: ./.github/actions/setup-ci-deps
      - uses: ./.github/actions/setup-fork-chromium
      - name: Check changed code
        run: vp run check:changed origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Generate isolated Android project
        env:
          T3CODE_FORK_BUILD: "1"
        working-directory: apps/mobile
        run: vp exec expo prebuild --platform android --no-install
      - name: Compile and test sharing lifecycle and fork init script
        working-directory: apps/mobile/android
        run: |
          install -d "$RUNNER_TEMP/ccache-bin" "$RUNNER_TEMP/ccache-dir"
          {
            echo '#!/usr/bin/env bash'
            echo 'exec "$@"'
          } > "$RUNNER_TEMP/ccache-bin/ccache"
          chmod +x "$RUNNER_TEMP/ccache-bin/ccache"
          PATH="$RUNNER_TEMP/ccache-bin:$PATH" CCACHE_DIR="$RUNNER_TEMP/ccache-dir"             ./gradlew --init-script ../../../scripts/fork-sharing-tests.gradle :app:verifyPatchedNativeSharing :t3-tailnet:testDebugUnitTest --build-cache --max-workers=2
      - name: Capture formatting fixes
        if: failure()
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/phone-sharing-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: phone-sharing-format-fixes
          path: ${{ runner.temp }}/phone-sharing-format.patch
          retention-days: 3
