name: Upstream sync
# claude-sync.yml reads the checked branch from the run name.
run-name: Upstream sync${{ inputs.branch && format(' {0}', inputs.branch) || '' }}

# Merges pingdotgg/t3code main into this fork every six hours. A clean merge that passes the
# fork checks is pushed to main; a conflict or failed check leaves main untouched and fails
# the run, which GitHub reports by email. See docs/operations/upstream-sync.md.
on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Fork branch to check and fast-forward main to (e.g. a resolved conflict); empty = main"
        required: false
        type: string
        default: ""
      promote_only:
        description: "Check and promote the selected branch without merging newer upstream code"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Runs upstream code (install scripts, tests), so it never sees the push token.
  merge:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - name: Checkout fork history without vendored gitlinks
        env:
          GIT_TERMINAL_PROMPT: "0"
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git config user.name "t3code-ek upstream sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - name: Install mergiraf for syntax-aware conflict resolution
        env:
          MERGIRAF_VERSION: "0.20.0"
          MERGIRAF_SHA256: fc77469be936b02ab9021b984a3aebc9250a21ae3d264f2ef2198eb8b31b2a7b
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mergiraf.tar.gz"
          curl -fsSL -o "$archive" "https://codeberg.org/mergiraf/mergiraf/releases/download/v$MERGIRAF_VERSION/mergiraf_x86_64-unknown-linux-musl.tar.gz"
          echo "$MERGIRAF_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" mergiraf
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: merge
        env:
          SYNC_BRANCH: ${{ inputs.branch }}
          SYNC_PROMOTE_ONLY: ${{ inputs.promote_only && 'true' || 'false' }}
          SYNC_CONFLICT_BUNDLE: ${{ runner.temp }}/handoff.bundle
        run: scripts/fork-upstream-sync.sh merge
      - if: steps.merge.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - if: steps.merge.outputs.changed == 'true'
        run: vp install
      - name: Format mergiraf output and regenerate the web route tree
        if: steps.merge.outputs.changed == 'true'
        run: |
          node scripts/fork-route-tree.mjs
          scripts/fork-upstream-sync.sh tidy
      - name: Install Python packaging test dependency
        if: steps.merge.outputs.changed == 'true'
        run: python3 -m pip install PyYAML==6.0.3
      - name: Check formatting before browser setup
        if: steps.merge.outputs.changed == 'true'
        run: |
          git diff --name-only --diff-filter=AM -z refs/remotes/origin/main HEAD |
            xargs -0 -r vp fmt --check --no-error-on-unmatched-pattern
      - name: Check lint before the long test suites
        if: steps.merge.outputs.changed == 'true'
        run: |
          node --input-type=module <<'JS'
          import { execFileSync, spawnSync } from "node:child_process";
          import { existsSync } from "node:fs";
          const files = execFileSync("git", ["diff", "--name-only", "--diff-filter=AM", "-z", "refs/remotes/origin/main", "HEAD"], { encoding: "utf8" })
            .split("\0").filter(file => /\.[cm]?[jt]sx?$/.test(file) && existsSync(file));
          if (files.length) process.exit(spawnSync("vp", ["lint", ...files], { stdio: "inherit" }).status ?? 1);
          JS
      - name: Install headless Chromium for web tests
        if: steps.merge.outputs.changed == 'true'
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi
      - name: Check mobile feed and cache-control integration
        if: steps.merge.outputs.changed == 'true'
        working-directory: apps/mobile
        run: |
          vp test run src/reactCompilerCoverage.test.ts \
            src/features/home/ThreadListToolbar.cacheWarming.test.tsx \
            -t 'compiles src/features/threads/ThreadFeed.tsx|shows the Android sidebar'
      - if: steps.merge.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream }}
          FORK_CHANGED_CHECKS_BASE: refs/remotes/origin/main
        run: scripts/fork-upstream-sync.sh checks
      - name: Capture formatting fixes for a failed sync
        if: failure() && steps.merge.outputs.changed == 'true'
        run: |
          git diff --name-only --diff-filter=AM -z refs/remotes/origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/fork-format.patch"
      - if: failure() && steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-format-fixes
          path: ${{ runner.temp }}/fork-format.patch
          retention-days: 3
      # A sync from main that conflicted, or merged cleanly but failed a check, goes to claude-sync.yml.
      - name: Keep the failed merge for claude-sync.yml
        id: handoff
        if: >-
          failure() && inputs.branch == '' &&
          (steps.merge.outputs.conflict == 'true' || steps.merge.outputs.changed == 'true')
        run: |
          [ -f "$RUNNER_TEMP/handoff.bundle" ] ||
            git bundle create "$RUNNER_TEMP/handoff.bundle" refs/remotes/origin/main..main
      - if: failure() && steps.handoff.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-handoff
          path: ${{ runner.temp }}/handoff.bundle
          retention-days: 3
      - if: steps.merge.outputs.changed == 'true'
        run: git bundle create "$RUNNER_TEMP/merge.bundle" refs/remotes/origin/main..main
      - if: steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-merge
          path: ${{ runner.temp }}/merge.bundle
          retention-days: 3

  # Fresh runner that executes no repository code: it only pushes the checked merge.
  push:
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: upstream-merge
          path: ${{ runner.temp }}
      - name: Push merged main
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # GITHUB_TOKEN cannot push commits that change workflow files, which upstream does often.
          set -euo pipefail
          [ -n "$SYNC_TOKEN" ] || { echo '::error::Set the UPSTREAM_SYNC_TOKEN secret (contents + workflows write).'; exit 1; }
          git init -q .
          git fetch -q --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" main:refs/remotes/origin/main
          git fetch -q "$RUNNER_TEMP/merge.bundle" main:refs/heads/merged
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/$GITHUB_REPOSITORY.git" refs/heads/merged:refs/heads/main
      - name: Delete the checked branch
        if: inputs.branch != '' && inputs.branch != 'main'
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          SYNC_BRANCH: ${{ inputs.branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: git push "https://x-access-token:${SYNC_TOKEN}@github.com/$GITHUB_REPOSITORY.git" ":refs/heads/$SYNC_BRANCH"
      - name: Disable workflows inherited from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upstream deploy/release workflows must not run in the fork; keep only fork-owned ones.
          set -euo pipefail
          keep=' android-arm64-existing.yml publish-fork-artifacts.yml release-desktop.yml release-fork.yml release-termux.yml nightly-fork.yml upstream-sync.yml claude-sync.yml fork-device-commands.yml fork-cache-hud.yml fork-macos-signing.yml fork-phone-sharing.yml fork-incoming-sharing.yml fork-thread-creation.yml fork-browser-proxy.yml '
          gh workflow list -R "$GITHUB_REPOSITORY" --json path,state --jq '.[] | select(.state == "active") | .path' |
            while read -r path; do
              name=${path##*/}
              case "$keep" in *" $name "*) ;; *) gh workflow disable "$name" -R "$GITHUB_REPOSITORY" && echo "Disabled $name" ;; esac
            done
