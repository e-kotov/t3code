name: Fork usage quota

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fork-usage-quota.yml"
      - "apps/server/src/provider/**"
      - "apps/server/src/textGeneration/Antigravity*"
      - "apps/web/src/usageCompact/**"
      - "scripts/fork-footprint-budget.json"

permissions:
  contents: read

concurrency:
  group: usage-quota-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_FORK_BUILD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install headless Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Prove quota regressions fail before the fix
        run: |
          source=apps/server/src/provider/antigravityUsageLimits.ts
          cp "$source" "$RUNNER_TEMP/quota-source.ts"
          trap 'cp "$RUNNER_TEMP/quota-source.ts" "$source"' EXIT
          git show "01f09a25a4:$source" > "$source"
          if vp test run apps/server/src/provider/forkAntigravityQuota.test.ts -t 'reads Gemini|does not fill' --reporter=json --outputFile="$RUNNER_TEMP/quota-before.json"; then
            echo 'The quota regressions must fail on pre-fix source.'
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'quota-before.json').read_text())
          failed = [test for suite in report['testResults'] for test in suite.get('assertionResults', []) if test['status'] == 'failed']
          assert len(failed) == 2, report
          assert all('AssertionError' in '\n'.join(test['failureMessages']) for test in failed), failed
          print('Both quota regressions failed with assertions on the pre-fix implementation.')
          PY
      - name: Capture the previous warning in Chromium
        run: |
          source=apps/web/src/usageCompact/CompactUsageControl.tsx
          cp "$source" "$RUNNER_TEMP/warning-source.tsx"
          trap 'cp "$RUNNER_TEMP/warning-source.tsx" "$source"' EXIT
          git show "d502f0f199:$source" > "$source"
          if vp test run apps/web/src/usageCompact/ForkQuotaWarning.browser.test.tsx --reporter=json --outputFile="$RUNNER_TEMP/warning-before.json"; then
            echo 'The named-warning regression must fail on pre-fix source.'
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib, shutil
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'warning-before.json').read_text())
          assert report['numFailedTests'] == 1, report
          shot = pathlib.Path('apps/web/src/usageCompact/__screenshots__/quota-warning.png')
          assert shot.is_file(), 'The real browser did not capture the previous warning'
          shutil.copyfile(shot, pathlib.Path(os.environ['RUNNER_TEMP']) / 'warning-before.png')
          PY
      - name: Verify quota parsing and warning behavior
        run: |
          vp test run apps/server/src/provider/forkAntigravityQuota.test.ts apps/server/src/provider/antigravityUsageLimits.test.ts
          vp test run apps/web/src/usageCompact/usageCompactReport.test.ts apps/web/src/usageCompact/CompactUsageControl.browser.test.tsx apps/web/src/usageCompact/HeaderUsageControl.browser.test.tsx apps/web/src/usageCompact/ForkQuotaWarning.browser.test.tsx
          cp apps/web/src/usageCompact/__screenshots__/quota-warning.png "$RUNNER_TEMP/warning-after.png"
      - name: Check changed code
        run: vp run check:changed origin/main
      - name: Verify upstream integration and fork mounts
        run: bash scripts/fork-upstream-sync.sh checks
      - name: Capture formatting fixes
        if: failure()
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/usage-quota-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: usage-quota-evidence
          path: |
            ${{ runner.temp }}/warning-before.png
            ${{ runner.temp }}/warning-after.png
            ${{ runner.temp }}/quota-before.json
            ${{ runner.temp }}/warning-before.json
            ${{ runner.temp }}/usage-quota-format.patch
          retention-days: 7
