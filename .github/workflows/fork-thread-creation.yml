name: Fork thread creation

on:
  workflow_dispatch:
    inputs:
      regression_ref:
        description: Optional pre-fix commit to prove scratch launch isolation
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths: &thread-paths
      - ".github/workflows/fork-thread-creation.yml"
      - "apps/web/src/components/threadReferenceContextMenu*"
      - "apps/mobile/src/features/threads/useNewThreadReferenceMenu*"
      - "apps/mobile/src/features/threads/newThreadReference*"
      - "apps/mobile/src/features/threads/seedThreadReferenceDraft*"
      - "apps/mobile/src/features/threads/ReferencedNewTaskDraftScreen*"
      - "apps/mobile/fork-react-tests.ts"
      - "apps/server/src/orchestration-v2/scratchThreadLaunch.ts"
      - "apps/server/src/orchestration-v2/ThreadLaunchService*"
  push:
    branches: [main]
    paths: *thread-paths

permissions:
  contents: read

concurrency:
  group: thread-creation-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ inputs.regression_ref || 'head' }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - run: vp install
      - name: Check formatting before regression proofs
        run: |
          base=$(git merge-base origin/main HEAD)
          if [ "$base" = "$(git rev-parse HEAD)" ]; then base=HEAD^; fi
          git diff --name-only --diff-filter=AM -z "$base" HEAD |
            xargs -0 -r vp fmt --check
      - name: Prove scratch launch isolation on a pre-fix revision
        if: github.event_name == 'workflow_dispatch' && inputs.regression_ref != ''
        env:
          REGRESSION_REF: ${{ inputs.regression_ref }}
        run: |
          git fetch --no-tags origin "$REGRESSION_REF"
          baseline=$(git rev-parse FETCH_HEAD)
          source=apps/server/src/orchestration-v2/ThreadLaunchService.ts
          cp "$source" "$RUNNER_TEMP/ThreadLaunchService.ts"
          trap 'cp "$RUNNER_TEMP/ThreadLaunchService.ts" "$source"' EXIT
          git show "$baseline:$source" > "$source"
          report="$RUNNER_TEMP/scratch-launch-regression.json"
          if vp test run apps/server/src/orchestration-v2/ThreadLaunchService.test.ts -t 'isolates scratch launches' --reporter=json --outputFile="$report"; then
            echo 'Scratch isolation must fail on the selected pre-fix revision.'
            exit 1
          fi
          python3 - "$report" <<'PYTHON'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          failed = [test for suite in result['testResults'] for test in suite.get('assertionResults', []) if test['status'] == 'failed']
          expected = {f'isolates scratch launches for {name} ({actor})' for name in ['existing-folder', 'branched-existing-folder'] for actor in ['user', 'agent']}
          assert result['numFailedTests'] == len(failed) == 4, result
          assert {test['fullName'] for test in failed} == expected, failed
          for test in failed:
              messages = '\n'.join(test['failureMessages'])
              assert 'AssertionError' in messages, test
              assert 'scratch workspace must belong to the new thread' in messages and '/scratch/old-thread' in messages, test
          print('Verified four expected scratch workspace failures against the pre-fix service.')
          PYTHON
      - name: Check changed code and thread creation
        run: |
          base=$(git merge-base origin/main HEAD)
          if [ "$base" = "$(git rev-parse HEAD)" ]; then base=HEAD^; fi
          vp run check:changed "$base"
          vp test run apps/web/src/components/threadReferenceContextMenu.test.ts apps/mobile/src/features/threads/useNewThreadReferenceMenu.test.ts apps/mobile/src/features/threads/newThreadReference.test.ts apps/mobile/src/features/threads/seedThreadReferenceDraft.test.ts apps/mobile/src/features/threads/ReferencedNewTaskDraftScreen.test.tsx
      - name: Capture formatting fixes
        if: failure()
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/thread-creation-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: thread-creation-format-fixes
          path: ${{ runner.temp }}/thread-creation-format.patch
          retention-days: 3
