name: Jules sync

# Hands upstream-sync conflicts to Jules (jules.google), then checks its pull request through
# upstream-sync.yml. Jules never pushes to main: a resolved pull request becomes one clean merge
# commit on sync/jules-<PR>, and the usual checks decide promotion. See docs/operations/upstream-sync.md.
on:
  workflow_run:
    workflows: ["Upstream sync"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  # Hourly: nudge a session that stopped to ask for input; fail visibly if one stays stuck.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      conflict_branch:
        description: "Existing sync/conflicts-* branch to hand to Jules"
        required: true
        type: string
      run_id:
        description: "Upstream-sync run whose failed checks the task should include (optional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jules-sync-${{ github.event.pull_request.number || 'handoff' }}
  cancel-in-progress: false

env:
  JULES_SOURCE: sources/github/e-kotov/t3code
  GIT_TERMINAL_PROMPT: "0"

jobs:
  # A sync from main conflicted or failed a check: push its merge and start a Jules session.
  handoff:
    if: >-
      github.repository == 'e-kotov/t3code' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.display_title == 'Upstream sync'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Push the conflicted merge
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCHED_BRANCH: ${{ inputs.conflict_branch }}
        run: |
          set -euo pipefail
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          git init -q .
          git config user.name "t3code-ek upstream sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${SYNC_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          if [ -n "${DISPATCHED_BRANCH:-}" ]; then
            git fetch -q --no-tags "$remote" "refs/heads/$DISPATCHED_BRANCH:refs/heads/conflict"
            echo "branch=$DISPATCHED_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n upstream-handoff -D "$RUNNER_TEMP/handoff"; then
            summary "The sync failed before merging; nothing for Jules."
            exit 0
          fi
          if [ -n "$(git ls-remote "$remote" 'refs/heads/sync/conflicts-*' 'refs/heads/sync/jules-*')" ]; then
            summary "A sync/conflicts-* or sync/jules-* branch exists, so a resolution is in progress."
            exit 0
          fi
          git fetch -q --no-tags "$remote" main:refs/remotes/origin/main
          git fetch -q "$RUNNER_TEMP/handoff/handoff.bundle" main:refs/heads/conflict
          branch="sync/conflicts-$(date -u +%Y%m%d-%H%M)"
          git push -q "$remote" "refs/heads/conflict:refs/heads/$branch"
          summary "Pushed the conflicted merge to \`$branch\`."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Start a Jules session
        if: steps.push.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          BRANCH: ${{ steps.push.outputs.branch }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${RUN_ID:-}"
          git show refs/heads/conflict:scripts/fork-jules.py > "$RUNNER_TEMP/fork-jules.py"
          git show refs/heads/conflict:.github/jules/resolve-upstream-conflicts.md > "$RUNNER_TEMP/prompt.md"
          merge=$(git rev-list --merges -1 refs/heads/conflict)
          if ! git log -1 --format=%s "$merge" | grep -q 'with unresolved conflicts' && [ -n "${RUN_ID:-}" ]; then
            {
              echo
              echo "## This run: the merge is clean but the fork's checks failed ($RUN_URL)"
              echo
              echo "Fix the cause in fork code on top of this branch. Failed steps and log excerpt:"
              echo
              gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
                --jq '.jobs[].steps[] | select(.conclusion == "failure") | "- " + .name'
              echo
              gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed.log"
              python3 "$RUNNER_TEMP/fork-jules.py" excerpt "$RUNNER_TEMP/failed.log"
            } >> "$RUNNER_TEMP/prompt.md"
          fi
          session=$(python3 "$RUNNER_TEMP/fork-jules.py" start "$JULES_SOURCE" "$BRANCH" \
            "Resolve upstream sync on $BRANCH" "$RUNNER_TEMP/prompt.md")
          echo "Started Jules session \`$session\` on \`$BRANCH\`; it opens a pull request when done." >> "$GITHUB_STEP_SUMMARY"

  # Jules opened or updated a pull request: rebuild one clean merge commit and check it.
  rebuild:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - name: Rebuild the merge from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          git init -q .
          git config user.name "t3code-ek upstream sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${SYNC_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --no-tags "$remote" "$HEAD_SHA" '+refs/heads/sync/conflicts-*:refs/conflicts/*'
          conflict=""
          for ref in $(git for-each-ref --format='%(refname)' refs/conflicts/); do
            if git merge-base --is-ancestor "$ref" "$HEAD_SHA"; then conflict=$ref; fi
          done
          [ -n "$conflict" ] || { summary "Not built on a sync/conflicts-* branch; nothing to do."; exit 0; }
          branch="sync/conflicts-${conflict#refs/conflicts/}"
          if git cat-file -e "$HEAD_SHA:.jules-needs-decision.md" 2>/dev/null; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Jules asked for a decision in \`.jules-needs-decision.md\`; nothing was promoted. Egor decides, then the branch can be checked with upstream-sync.yml."
            summary "Waiting for a decision (.jules-needs-decision.md)."
            exit 0
          fi
          # The upstream merge, under any commits the sync added on top (formatting, route tree).
          base_merge=$(git rev-list --merges -1 "$conflict")
          unresolved=$(git log -1 --format=%B "$base_merge" | sed -n 's/^Unresolved: //p')
          left=""
          for file in $unresolved; do
            if git show "$HEAD_SHA:$file" 2>/dev/null | grep -qE '^(<{7}|>{7})( |$)'; then left="$left $file"; fi
          done
          if [ -n "$left" ]; then
            summary "Conflict markers remain in:$left. Waiting for further commits."
            exit 0
          fi
          upstream=$(git rev-parse "$base_merge^2")
          merged=$(git commit-tree "$HEAD_SHA^{tree}" -p "$base_merge^1" -p "$upstream" \
            -m "Merge upstream main ${upstream:0:10}" \
            -m "Resolved by Jules in #$PR.${unresolved:+ Conflicts:}$(printf ' %s' $unresolved)")
          target="sync/jules-$PR"
          git push -q -f "$remote" "$merged:refs/heads/$target"
          summary "Rebuilt the merge as \`$target\` (${merged:0:10}) from #$PR, based on \`$branch\`."
          if [[ "$branch" == *-test* ]]; then
            summary "Test branch: not dispatching upstream-sync.yml."
            exit 0
          fi
          gh workflow run upstream-sync.yml -R "$GITHUB_REPOSITORY" -f branch="$target" -f promote_only=true
          summary "Dispatched upstream-sync.yml for \`$target\`."

  # A check of sync/jules-<PR> finished: report failures to Jules, or clean up after promotion.
  report:
    if: >-
      github.event_name == 'workflow_run' &&
      startsWith(github.event.workflow_run.display_title, 'Upstream sync sync/jules-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - name: Report the check to the pull request and Jules
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          target=${TITLE#Upstream sync }
          pr=${target#sync/jules-}
          [[ "$pr" =~ ^[0-9]+$ ]] || exit 0
          url=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json url --jq .url)
          head=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          [ "$CONCLUSION" = success ] || [ "$CONCLUSION" = failure ] || exit 0
          if [ "$CONCLUSION" = success ]; then
            gh pr close "$pr" -R "$GITHUB_REPOSITORY" --comment "Checked and promoted to main by $RUN_URL." || true
            for branch in "$head" $(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/sync/conflicts-" --jq '.[].ref' | sed 's#^refs/heads/##'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null || true
            done
            exit 0
          fi
          failures=$(gh run list -R "$GITHUB_REPOSITORY" --workflow upstream-sync.yml --limit 50 \
            --json displayTitle,conclusion --jq "[.[] | select(.displayTitle == \"$TITLE\" and .conclusion == \"failure\")] | length")
          if [ "$failures" -gt 3 ]; then
            gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "Checks failed $failures times ($RUN_URL). Stopping automatic fixes; this needs Egor."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/fork-jules.py" --jq .content | base64 -d > "$RUNNER_TEMP/fork-jules.py"
          {
            echo "The fork's CI checked your resolution (rebuilt as one merge commit on $target) and it failed: $RUN_URL"
            echo "Fix the cause in this pull request with a new commit. Failed steps and log excerpt:"
            echo
            gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[].steps[] | select(.conclusion == "failure") | "- " + .name'
            echo
            gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed.log"
            python3 "$RUNNER_TEMP/fork-jules.py" excerpt "$RUNNER_TEMP/failed.log"
            echo
            echo "This runs unattended: do not wait for answers. Commit the fix on the pull request's branch."
          } > "$RUNNER_TEMP/message.md"
          gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "Checks failed: $RUN_URL. Sent the log to Jules (attempt $failures of 3)."
          if session=$(python3 "$RUNNER_TEMP/fork-jules.py" find "$url"); then
            python3 "$RUNNER_TEMP/fork-jules.py" send "$session" "$RUNNER_TEMP/message.md"
          else
            gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "Could not find the Jules session for this pull request; reply to Jules there with the log above."
          fi

  # Jules sessions can stop to ask a question, which nobody answers in an unattended run.
  watch:
    if: github.event_name == 'schedule' && github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Keep Jules sessions on sync/conflicts-* branches moving
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          branches=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/sync/conflicts-" --jq '.[].ref' | sed 's#^refs/heads/##')
          [ -n "$branches" ] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/fork-jules.py" --jq .content | base64 -d > "$RUNNER_TEMP/fork-jules.py"
          jules() { python3 "$RUNNER_TEMP/fork-jules.py" "$@"; }
          echo "This task runs unattended and nobody will answer questions. Continue with your best judgment as the task describes; for a product decision, follow its step 6. Commit your work so the pull request is created." > "$RUNNER_TEMP/nudge.md"
          stuck=0
          for branch in $branches; do
            if ! session=$(jules titled "$branch"); then
              echo "::error::No Jules session found for $branch."
              stuck=1
              continue
            fi
            read -r state pr messages <<<"$(jules status "$session")"
            echo "\`$branch\`: $session $state $pr, $messages messages" >> "$GITHUB_STEP_SUMMARY"
            case "$state" in
              AWAITING_USER_FEEDBACK | FAILED)
                # The API reported FAILED briefly while a session was still resumable.
                if [ "$messages" -ge 6 ]; then
                  echo "::error::$session is $state after $messages messages; this needs Egor."
                  stuck=1
                else
                  jules send "$session" "$RUNNER_TEMP/nudge.md"
                fi
                ;;
              COMPLETED)
                if [ "$pr" != pr ]; then
                  echo "::error::$session completed without a pull request."
                  stuck=1
                fi
                ;;
            esac
          done
          exit "$stuck"
