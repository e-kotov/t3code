name: Fork machine groups

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fork-machine-groups.yml"
      - "apps/web/src/components/Sidebar.tsx"
      - "apps/web/src/components/CommandPalette.tsx"
      - "apps/web/src/components/MachinePickerIndicators.tsx"
      - "apps/web/src/components/MachineFilters*"
      - "apps/web/src/components/sidebar/sidebarMachineScope*"
      - "apps/web/src/components/chat/HeaderContextLabels*"
      - "apps/web/src/uiStateStore.ts"
      - "apps/web/src/components/settings/TargetedMachineConnection*"
      - "apps/web/src/components/settings/TargetedLocalMachineConnection*"
      - "apps/web/src/components/settings/ConnectionsSettings.tsx"
      - "apps/web/src/usageCompact/HeaderUsageControl.browser.test.tsx"
      - "packages/client-runtime/src/state/machineGroupCollapse*"
      - "packages/client-runtime/package.json"
      - "scripts/fork-footprint-budget.json"
      - "apps/web/src/components/sidebar/*achineGroup*"
      - "apps/web/src/components/sidebar/MachineGroupFolding*"
      - "apps/web/src/components/sidebar/sidebarConversationGroups*"
      - "apps/mobile/src/features/home/*MachineFilter*"
      - "apps/mobile/src/features/home/machineFilter*"
      - "apps/mobile/src/features/home/home-list-filter-menu.ts"
      - "apps/mobile/src/features/home/ThreadListFilters.tsx"
      - "apps/mobile/src/features/home/HomeRouteScreen.tsx"
      - "apps/mobile/src/features/threads/ThreadNavigationSidebar.tsx"
      - "apps/mobile/src/components/ui/MenuPopup.android.tsx"
      - "apps/mobile/src/components/ui/liveMenuActionPath.ts"
      - "apps/mobile/src/components/ui/AndroidAnchoredMenu.android.tsx"
      - "apps/mobile/fork-react-tests.ts"
      - "apps/mobile/src/features/threads/*achineGroup*"
      - "apps/mobile/src/features/threads/conversationListOrder*"
      - "apps/mobile/src/features/threads/useConversationThreadListV2*"

permissions:
  contents: read

concurrency:
  group: machine-groups-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CHECK_CHANGED_TIMEOUT: "1800"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
      - name: Check fork footprint
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          python3 scripts/fork-footprint-budget.py
      - uses: ./.github/actions/setup-ci-deps
      - uses: ./.github/actions/setup-fork-chromium
      - name: Prove folded mobile search fails before the fix
        if: github.event.pull_request.number == 7
        run: |
          files=(apps/mobile/src/features/threads/useConversationThreadListV2.ts apps/mobile/src/features/threads/machineGroupedThreadList.ts)
          for file in "${files[@]}"; do
            cp "$file" "$RUNNER_TEMP/$(basename "$file")"
          done
          restore() {
            for file in "${files[@]}"; do cp "$RUNNER_TEMP/$(basename "$file")" "$file"; done
          }
          trap restore EXIT
          for file in "${files[@]}"; do git show "117691e0424ff6df40509267f8debd68b48dd896:$file" > "$file"; done
          if vp test run apps/mobile/src/features/threads/useConversationThreadListV2.test.tsx > "$RUNNER_TEMP/fold-regression.log" 2>&1; then
            cat "$RUNNER_TEMP/fold-regression.log"
            echo 'The search regression must fail on the previous implementation.'
            exit 1
          fi
          cat "$RUNNER_TEMP/fold-regression.log"
          python3 -c 'import os, pathlib; assert "AssertionError" in (pathlib.Path(os.environ["RUNNER_TEMP"]) / "fold-regression.log").read_text()'
      - name: Prove separate shelf folding fails before the fix
        if: github.event.pull_request.number == 80
        run: |
          files=(apps/web/src/components/sidebar/sidebarConversationGroups.ts apps/mobile/src/features/threads/machineGroupedThreadList.ts)
          for file in "${files[@]}"; do cp "$file" "$RUNNER_TEMP/$(basename "$file")"; done
          restore() {
            for file in "${files[@]}"; do cp "$RUNNER_TEMP/$(basename "$file")" "$file"; done
          }
          trap restore EXIT
          for file in "${files[@]}"; do git show "8be2bf4d8bd7332e4c3e867bbccfb7e381f83c24:$file" > "$file"; done
          if vp test run apps/web/src/components/sidebar/sidebarConversationGroups.test.ts apps/mobile/src/features/threads/conversationListOrder.test.ts -t 'folds each shelf independently' > "$RUNNER_TEMP/shelf-fold-before.log" 2>&1; then
            cat "$RUNNER_TEMP/shelf-fold-before.log"
            echo 'Separate shelf folding must fail before the fix.'
            exit 1
          fi
          cat "$RUNNER_TEMP/shelf-fold-before.log"
          python3 -c 'import os, pathlib; assert "AssertionError" in (pathlib.Path(os.environ["RUNNER_TEMP"]) / "shelf-fold-before.log").read_text()'
      - name: Capture machine sections before the change
        run: |
          files=(apps/web/src/components/sidebar/SidebarMachineGroupHeader.tsx apps/web/src/components/sidebar/sidebarConversationGroups.ts apps/web/src/components/sidebar/machineGroupCollapse.ts)
          for file in "${files[@]}"; do cp "$file" "$RUNNER_TEMP/$(basename "$file")"; done
          restore() {
            for file in "${files[@]}"; do cp "$RUNNER_TEMP/$(basename "$file")" "$file"; done
          }
          trap restore EXIT
          for file in "${files[@]}"; do git show "origin/main:$file" > "$file"; done
          VITE_MACHINE_FOLD_CAPTURE=before vp test run apps/web/src/components/sidebar/MachineGroupFolding.app.browser.test.tsx
      - name: Verify independent machine section controls and capture the result
        run: VITE_MACHINE_FOLD_CAPTURE=after vp test run apps/web/src/components/sidebar/MachineGroupFolding.app.browser.test.tsx
      - name: Capture machine pickers before the change
        run: |
          files=(apps/web/src/components/Sidebar.tsx apps/web/src/components/CommandPalette.tsx)
          for file in "${files[@]}"; do cp "$file" "$RUNNER_TEMP/$(basename "$file")"; done
          restore() {
            for file in "${files[@]}"; do cp "$RUNNER_TEMP/$(basename "$file")" "$file"; done
          }
          trap restore EXIT
          for file in "${files[@]}"; do git show "origin/main:$file" > "$file"; done
          VITE_MACHINE_FILTER_CAPTURE=before vp test run apps/web/src/components/MachineFilters.app.browser.test.tsx
      - name: Verify machine picker interactions and capture the result
        run: VITE_MACHINE_FILTER_CAPTURE=after vp test run apps/web/src/components/MachineFilters.app.browser.test.tsx
      - name: Check changed code
        run: vp run check:changed origin/main
      - name: Check surrounding mobile list behavior
        run: vp test run apps/mobile/src/features/threads/threadListV2.test.ts apps/mobile/src/reactCompilerCoverage.test.ts
      - name: Capture formatting fixes
        if: failure()
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/machine-groups-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: machine-filter-evidence
          include-hidden-files: true
          path: |
            .t3/machine-filter-evidence/
            .t3/machine-fold-evidence/
            ${{ runner.temp }}/machine-groups-format.patch
          retention-days: 3
