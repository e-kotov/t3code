name: Fork settle navigation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fork-settle-navigation.yml"
      - "apps/web/src/components/Sidebar.tsx"
      - "apps/web/src/components/settings/SettingsPanels.tsx"
      - "apps/web/src/components/settings/SettleNavigationSetting.tsx"
      - "apps/web/src/components/settings/settleNavigationSearch*"
      - "apps/web/src/components/settings/settingsSearch.ts"
      - "apps/web/src/components/sidebar/settleNavigation*"
      - "apps/web/src/components/sidebar/useSettleNavigation.ts"
      - "apps/web/src/settleAndAdvance.ts"
      - "apps/web/test/fakeEnvironment.ts"
      - "packages/contracts/src/settings.ts"
      - "packages/contracts/src/settleNavigationSettings*"
      - "scripts/fork-footprint-budget.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settle-navigation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CHECK_CHANGED_TIMEOUT: "1800"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
      - name: Check fork footprint
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          python3 scripts/fork-footprint-budget.py
      - uses: ./.github/actions/setup-ci-deps
      - uses: ./.github/actions/setup-fork-chromium
      - name: Check changed code
        run: vp run check:changed origin/main
      - name: Run settle navigation tests
        run: vp test run packages/contracts/src/settleNavigationSettings.test.ts apps/web/src/components/settings/settleNavigationSearch.test.ts apps/web/src/components/sidebar/settleNavigation.logic.test.ts apps/web/src/settleAndAdvance.test.ts
      - name: Settle the open thread in each mode with captures
        run: VITE_SETTLE_CAPTURE=1 vp test run apps/web/src/components/sidebar/settleNavigation*.app.browser.test.tsx
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: settle-navigation-captures
          path: .t3/settle-evidence/
          retention-days: 14
