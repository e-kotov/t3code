name: Fork shared-file sending

on:
  workflow_dispatch:
    inputs:
      regression_ref:
        description: Optional pre-fix commit to prove the shared-file send regression
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths: &shared-file-paths
      - ".github/workflows/fork-shared-files.yml"
      - "apps/mobile/src/features/sharing/forkSharedAttachmentIds.ts"
      - "apps/mobile/src/features/sharing/forkSharedDocuments.test.ts"
      - "apps/mobile/src/state/use-composer-drafts.ts"
      - "apps/mobile/src/features/threads/incomingShareImport.ts"
  push:
    branches: ["sync/android-share-send"]
    paths: *shared-file-paths

permissions:
  contents: read

concurrency:
  group: shared-file-sending-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - run: vp install
      - name: Prove the regression on the pre-fix revision
        if: github.event_name == 'workflow_dispatch' && inputs.regression_ref != ''
        env:
          REGRESSION_REF: ${{ inputs.regression_ref }}
        run: |
          git fetch --no-tags origin "$REGRESSION_REF"
          baseline=$(git rev-parse FETCH_HEAD)
          sources=(apps/mobile/src/state/use-composer-drafts.ts apps/mobile/src/features/threads/incomingShareImport.ts)
          for index in "${!sources[@]}"; do
            cp "${sources[$index]}" "$RUNNER_TEMP/shared-file-source-$index.ts"
          done
          restore() {
            for index in "${!sources[@]}"; do
              cp "$RUNNER_TEMP/shared-file-source-$index.ts" "${sources[$index]}"
            done
          }
          trap restore EXIT
          for source in "${sources[@]}"; do git show "$baseline:$source" > "$source"; done
          if vp test run apps/mobile/src/features/sharing/forkSharedDocuments.test.ts --reporter=json --outputFile="$RUNNER_TEMP/shared-file-regression.json"; then
            echo 'Shared-file send regressions must fail before the fix.'
            exit 1
          fi
          python3 - <<'PYTHON'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'shared-file-regression.json').read_text())
          failed = [test for suite in result['testResults'] for test in suite.get('assertionResults', []) if test['status'] == 'failed']
          assert result['numFailedTests'] == len(failed) == 6, result
          for test in failed:
              assert 'AssertionError' in '\n'.join(test['failureMessages']), test
          PYTHON
      - name: Check changed code and shared-file sending
        run: |
          base=$(git merge-base origin/main HEAD)
          vp run check:changed "$base"
          vp test run apps/mobile/src/features/sharing/forkSharedDocuments.test.ts apps/mobile/src/state/use-composer-drafts.test.ts apps/mobile/src/lib/composerContext.test.ts apps/mobile/src/features/sharing/forkShareDestinationController.test.ts apps/mobile/src/features/threads/incomingShareImport.test.ts
          python3 scripts/fork-footprint-budget.py
      - name: Capture formatting fixes
        if: failure()
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/shared-file-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: shared-file-format-fixes
          path: ${{ runner.temp }}/shared-file-format.patch
          retention-days: 3
