name: Fork session renewal

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/server/src/auth/**"
      - "apps/server/src/peer/**"
      - "apps/server/src/server.ts"
      - "packages/client-runtime/src/connection/**"
      - "packages/contracts/src/forkSessionRenewal.ts"
      - "apps/web/src/connection/**"
      - "apps/mobile/src/connection/**"
      - ".github/workflows/fork-session-renewal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-session-renewal-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  renewal:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_FORK_BUILD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch -q --no-tags origin main "$CHECKOUT_REF"
          git checkout -q --detach "$CHECKOUT_REF"
          git fetch -q --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
      - uses: ./.github/actions/setup-ci-deps
      - name: Prove overlapping-lease regressions reject the previous renewal code
        run: |
          source=packages/client-runtime/src/connection/forkDirectSessionRenewal.ts
          cp "$source" "$RUNNER_TEMP/renewal-source.ts"
          trap 'cp "$RUNNER_TEMP/renewal-source.ts" "$source"' EXIT
          git show "556e3866785ca5ce57a3bf06e43a16490dff514b:$source" > "$source"
          if vp test run packages/client-runtime/src/connection/forkDirectSessionRenewal.test.ts \
            -t 'queues a replacement lease|keeps a token paired again while a renewal was in flight' \
            --reporter=json --outputFile="$RUNNER_TEMP/renewal-overlap-regression.json"; then
            echo 'The overlapping-lease regressions must fail on the previous renewal code.'
            exit 1
          fi
          python3 - <<'PYTHON'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'renewal-overlap-regression.json').read_text())
          failed = [test for suite in result['testResults'] for test in suite.get('assertionResults', []) if test['status'] == 'failed']
          assert result['numFailedTests'] == 2 and len(failed) == 2 and result['numPassedTests'] == 0, result
          for test in failed:
              assert 'AssertionError' in '\n'.join(test['failureMessages']), test
          print('Both overlapping-lease regressions reject the previous renewal code.')
          PYTHON
      - name: Typecheck renewal packages directly
        run: |
          renewal_check_failed=0
          for renewal_package in packages/contracts packages/client-runtime apps/server apps/web apps/mobile; do
            echo "::group::Typecheck $renewal_package"
            if (cd "$renewal_package" && vp exec effect-tsgo tsrs --noEmit --pretty false); then
              echo "$renewal_package passed"
            else
              renewal_check_status=$?
              echo "::error::$renewal_package typecheck exited $renewal_check_status"
              renewal_check_failed=1
              # The checker can exit non-zero without printing an error; this lists them.
              (cd "$renewal_package" && vp exec effect-tsgo diagnostics --project "$PWD/tsconfig.json" \
                --format text --severity error,warning) || true
            fi
            echo "::endgroup::"
          done
          exit "$renewal_check_failed"
      - name: Test renewal, expiry, revocation, storage races, live HTTP credential, mobile transport and peer-link recovery
        run: |
          vp test run \
            apps/server/src/auth/ForkSessionRenewal.test.ts \
            apps/server/src/auth/forkSessionRenewal.tripwire.test.ts \
            apps/server/src/peer/ForkPeerLinkRenewal.test.ts \
            apps/server/src/auth/SessionStore.test.ts \
            apps/server/src/peer/PeerLinks.test.ts \
            packages/client-runtime/src/connection/forkCredentialCatalog.test.ts \
            packages/client-runtime/src/connection/forkDirectSessionRenewal.test.ts \
            packages/client-runtime/src/connection/driver.test.ts \
            packages/client-runtime/src/connection/supervisor.test.ts \
            packages/client-runtime/src/connection/builtInTailnet.test.ts \
            apps/web/src/connection/forkFreshCatalogStore.test.ts \
            apps/web/src/connection/storage.test.ts \
            apps/mobile/src/connection/forkFreshCatalogStore.test.ts \
            apps/mobile/src/connection/forkRenewalServices.test.ts \
            apps/mobile/src/connection/storage.test.ts
