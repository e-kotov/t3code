name: Fork release

# Releases are dispatched on main, not started by the tag push: Actions caches
# saved under a tag ref are invisible to the next tag, so tag-triggered runs
# rebuilt Android from a cold Gradle cache every time.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork version, for example 0.1.3-ek.202610260001 (without v)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release after every build succeeds"
        default: false
        type: boolean
      commit:
        description: "Exact main commit to build; empty uses the dispatch commit"
        default: ""
        type: string
      nightly:
        description: "Label this prerelease as a nightly build"
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  prepare:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ek\.[0-9]+$ ]] || { echo 'Expected MAJOR.MINOR.PATCH-ek.NUMBER'; exit 1; }
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full build commit SHA.'; exit 1; }
          printf 'sha=%s\nversion=%s\ntag=v%s\n' "$REQUESTED_COMMIT" "$version" "$version" >> "$GITHUB_OUTPUT"
      - name: Require the published commit to belong to main
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...main" --jq .status)"
          [[ "$status" == identical || "$status" == ahead ]] || { echo 'Published commit must be on main.'; exit 1; }
      - name: Require an existing tag for publication
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" || {
            echo "Push $RELEASE_TAG at the build commit before publishing."
            exit 1
          }
          [[ "$tag_sha" == "$RELEASE_SHA" ]] || { echo 'Release tag must point to the selected build commit.'; exit 1; }

  bundle:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout release commit without vendored gitlinks
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - run: vp run --concurrency-limit 2 --filter @t3tools/contracts --filter @t3tools/shared --filter @t3tools/client-runtime --filter @t3tools/web --filter ./apps/server typecheck
      - run: vp run build:desktop
      - name: Package native Termux ARM64 server
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/build-termux-server.test.py
          python3 scripts/build-termux-server.py --bundle apps/server/dist --output release-termux --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-termux-server
          path: release-termux/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  mac:
    needs: [prepare, bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only; Intel Macs are not a target of this fork.
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Mac ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      platform: mac
      target: dmg
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  mac_signed:
    needs: [prepare, mac]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout signing code from the build commit
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_REF"
          git sparse-checkout set --no-cone /scripts/fork-macos-sign.py /scripts/fork-macos-sign.test.py /scripts/fork-homebrew-cask.rb
          git checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-mac-arm64
          path: unsigned-mac
      - name: Verify update identity and sign both installers
        env:
          FORK_MACOS_CERTIFICATE_BASE64: ${{ secrets.FORK_MACOS_CERTIFICATE_BASE64 }}
          FORK_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.FORK_MACOS_CERTIFICATE_PASSWORD }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/fork-macos-sign.test.py
          python3 scripts/fork-macos-sign.py unsigned-mac signed-mac --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-mac-signed
          path: signed-mac/*
          if-no-files-found: error

  linux_server:
    needs: [prepare, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout release commit without vendored gitlinks
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: js-bundle
          path: apps
      - run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
      - run: |
          mkdir -p apps/server/dist/resource-monitor/linux-x64
          cp native/resource-monitor/target/release/t3-resource-monitor apps/server/dist/resource-monitor/linux-x64/
      - run: node apps/server/scripts/cli.ts build-exe --verbose
      - run: node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$RELEASE_VERSION" --output-dir release-cli
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-linux-server
          path: release-cli/*.tar.gz
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      T3CODE_FORK_BUILD: "1"
      T3CODE_FORK_VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_FORK_VERSION_CODE: ${{ github.run_number }}
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Checkout release commit without vendored gitlinks
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/mobile/modules/t3-tailnet/go/go.mod
          cache-dependency-path: apps/mobile/modules/t3-tailnet/go/go.sum
      - name: Test and build the built-in Tailscale engine
        run: |
          (cd apps/mobile/modules/t3-tailnet/go && go test ./...)
          scripts/build-tailnet-android.sh
      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false
      - name: Install the native compiler cache
        id: ccache_install
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/t3-android-ccache" >> "$GITHUB_ENV"
      - name: Restore native compiler results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/t3-android-ccache
          key: android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ needs.prepare.outputs.sha }}
          restore-keys: |
            android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
            android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: ccache --zero-stats
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Require the persistent fork signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]] || { echo 'Configure the Android release signing secrets.'; exit 1; }
      - run: vp install --filter=@t3tools/mobile...
      - run: vp run --filter @t3tools/mobile typecheck
      - run: vp exec --filter @t3tools/mobile -- expo prebuild --clean --platform android --no-install
      # One Gradle run configures the project once for both tasks; a failing
      # test stops the build.
      - name: Test native notification handling and build a standalone release APK
        working-directory: apps/mobile/android
        run: ./gradlew :t3-agent-notifications:testDebugUnitTest :t3-citation-passage:testDebugUnitTest assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache --no-daemon --max-workers=4
      - name: Report native compiler cache hits
        if: always() && steps.ccache_install.outcome == 'success'
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sign APK with the fork key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/t3code-ek.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p release-android
          "$build_tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias t3code-ek \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "release-android/T3-Code-EK-$RELEASE_VERSION-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify "release-android/T3-Code-EK-$RELEASE_VERSION-arm64.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-android
          path: release-android/*.apk
          if-no-files-found: error

  release:
    needs: [prepare, mac_signed, linux_server, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: fork-*
          path: assets
          merge-multiple: true
      - name: Collect installers and checksums
        working-directory: assets
        run: |
          set -euo pipefail
          # Each architecture emits a latest-mac.yml with the same name. Manual
          # installers are released until a merged fork updater feed is added.
          find . -name '*.yml' -delete
          sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-installers
          path: assets/*
          if-no-files-found: error
      - name: Publish fork release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Fork installers for Mac (Apple Silicon), Android, Linux x64 server, and native Termux ARM64 server (with web UI).
          The Termux bundle installs with t3-termux update from Egor's Termux dotfiles; native dependencies are prepared on the phone.
          Mac builds use the fork's persistent private signing certificate and are not Apple notarized. Android uses the fork's own signing key and package ID.
          Direct SSH/Tailscale pairing works without upstream cloud configuration. Upstream Expo updates are disabled.
          Android direct notifications use the paired SSH/Tailscale server connection and do not require T3 Connect; Android keeps an ongoing connection notification while listening.
          Cache warming is off by default. The global Warm all control updates each eligible conversation toggle on the selected server; warm turns are visible and billable.
          Herdr-style cache/context HUD on Mac, web and Android: estimated countdown, last-request cache hit percentage, cached tokens and context used/max. Claude reported lifetime and Codex estimates are distinguished. Install this Linux server too for the HUD on remote connections.
          Verify downloaded assets against SHA256SUMS.
          NOTES
          printf '\nBuild commit: %s.\n' "$RELEASE_SHA" >> "$RUNNER_TEMP/release-notes.md"
          title="T3 Code EK $RELEASE_VERSION"
          if [[ "$NIGHTLY" == true ]]; then title="$title (nightly $(date -u +%F))"; fi
          gh release create "$RELEASE_TAG" assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false

  homebrew_tap:
    # Points e-kotov/tap's t3-code-ek cask at the release just published, so
    # `brew upgrade --cask t3-code-ek` finds it. Installing stays manual.
    needs: [prepare, release]
    if: inputs.publish
    runs-on: ubuntu-24.04
    concurrency:
      group: homebrew-tap-t3-code-ek
      cancel-in-progress: false
    steps:
      - name: Update t3-code-ek cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$TAP_DEPLOY_KEY" ]]; then
            echo '::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the cask was not updated.'
            exit 0
          fi

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          checksum() {
            awk -v name="$1" '$2 == name { print $1 }' "$RUNNER_TEMP/SHA256SUMS"
          }
          arm="$(checksum "T3-Code-$RELEASE_VERSION-arm64.dmg")"
          [[ "$arm" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'The Apple Silicon DMG checksum must be present in SHA256SUMS.'
            exit 1
          }

          # Trust only the host keys GitHub publishes over authenticated HTTPS.
          ssh_dir="$RUNNER_TEMP/tap-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"

          git clone --depth 1 git@github.com:e-kotov/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cask=Casks/t3-code-ek.rb
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$cask")"
          [[ -n "$current" ]] || { echo "No version line in $cask."; exit 1; }
          newest="$(printf '%s\n%s\n' "$current" "$RELEASE_VERSION" | sort -V | tail -n 1)"
          if [[ "$current" == "$RELEASE_VERSION" || "$newest" != "$RELEASE_VERSION" ]]; then
            echo "Cask is at $current; not moving it to $RELEASE_VERSION."
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/fork-homebrew-cask.rb?ref=$RELEASE_SHA" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/cask-template.rb"
          sed -e "s/@VERSION@/$RELEASE_VERSION/g" -e "s/@SHA256@/$arm/g" \
            "$RUNNER_TEMP/cask-template.rb" > "$RUNNER_TEMP/cask.rb"
          ruby -c "$RUNNER_TEMP/cask.rb"
          mv "$RUNNER_TEMP/cask.rb" "$cask"
          if ! grep -qF "\"$arm\"" "$cask"; then
            echo 'Cask checksum line was not found.'
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qam "Update T3 Code EK cask to $RELEASE_VERSION"
          git push origin HEAD
          git diff HEAD~1 --stat
