name: Fork incoming sharing

on:
  workflow_dispatch:
  push:
    branches: ["sync/android-file-sharing", "sync/android-share-destination"]

permissions:
  contents: read

concurrency:
  group: incoming-sharing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      T3CODE_FORK_BUILD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - run: vp install
      - name: Format candidate on the runner
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/sharing-format.patch"
      - name: Test incoming shares and document imports
        run: |
          vp test run apps/mobile/src/features/observability/forkObserve.test.ts apps/mobile/src/features/sharing/forkIncomingShareEvents.test.ts apps/mobile/src/features/sharing/forkSharedDocuments.test.ts apps/mobile/src/features/sharing/forkShareDestinationController.test.ts apps/mobile/src/features/sharing/forkShareDestinations.test.ts apps/mobile/src/features/sharing/incoming-share-inbox.test.ts apps/mobile/src/features/sharing/incoming-share-model.test.ts apps/mobile/src/features/threads/incomingShareImport.test.ts
      - name: Prove an unconfigured Observe module crashes before the fix
        run: |
          source=apps/mobile/src/features/observability/observe.ts
          cp "$source" "$RUNNER_TEMP/observe.ts"
          trap 'cp "$RUNNER_TEMP/observe.ts" "$source"' EXIT
          git show "b39ffd011ddcea79c75b456c0a4db05cbb6efad0:$source" > "$source"
          if vp test run apps/mobile/src/features/observability/forkObserve.test.ts > "$RUNNER_TEMP/observe-regression.log" 2>&1; then
            cat "$RUNNER_TEMP/observe-regression.log"
            echo 'The startup regression must fail when Observe is imported without a project ID.'
            exit 1
          fi
          cat "$RUNNER_TEMP/observe-regression.log"
          python3 -c 'import os, pathlib; assert "Project ID is required to send observability metrics" in (pathlib.Path(os.environ["RUNNER_TEMP"]) / "observe-regression.log").read_text()'
      - name: Check changed code
        run: vp run check:changed origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false
      - name: Generate isolated Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --platform android --no-install
      - name: Require patched native sharing instead of the stock precompiled library
        working-directory: apps/mobile/android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain --no-daemon --max-workers=2 > "$RUNNER_TEMP/sharing-dependencies.log"
          python3 - <<'PY'
          import os, pathlib
          dependencies = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'sharing-dependencies.log').read_text()
          assert 'project :expo-sharing' in dependencies, 'Patched expo-sharing source is absent from the Android runtime classpath'
          assert 'host.exp.exponent:expo.modules.sharing:' not in dependencies, 'The unpatched precompiled sharing library is linked'
          assert 'expo-observe' not in dependencies and 'expo.modules.observe' not in dependencies, 'Unconfigured native Observe must not initialize during standalone startup'
          PY
      - name: Test the Android transcript and PDF parser
        working-directory: apps/mobile/android
        run: ./gradlew --init-script ../../../scripts/fork-sharing-tests.gradle :expo-sharing:testDebugUnitTest --no-daemon --max-workers=2
      - name: Prove a share delivered without a resume fails before the fix
        run: |
          source=apps/mobile/src/features/sharing/forkIncomingShareEvents.ts
          cp "$source" "$RUNNER_TEMP/forkIncomingShareEvents.ts"
          trap 'cp "$RUNNER_TEMP/forkIncomingShareEvents.ts" "$source"' EXIT
          git show "92290213e87cfe7993cec791b3da420b1fdb3b0b:$source" > "$source"
          if vp test run apps/mobile/src/features/sharing/forkIncomingShareEvents.test.ts > "$RUNNER_TEMP/share-regression.log" 2>&1; then
            cat "$RUNNER_TEMP/share-regression.log"
            echo 'The incoming-share regression must fail with foreground-only delivery.'
            exit 1
          fi
          cat "$RUNNER_TEMP/share-regression.log"
          python3 -c 'import os, pathlib; assert "AssertionError" in (pathlib.Path(os.environ["RUNNER_TEMP"]) / "share-regression.log").read_text()'
      - name: Capture formatting fixes
        if: always()
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/sharing-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sharing-format-fixes
          path: ${{ runner.temp }}/sharing-format.patch
          retention-days: 3
