name: Fork browser proxy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fork-browser-proxy.yml"
      - "apps/server/src/preview/*Proxy*"
      - "apps/server/src/preview/Manager.ts"
      - "apps/server/src/preview/ServerBrowser*"
      - "apps/server/src/mcp/toolkits/preview/*"
      - "apps/web/src/browser/*roxy*"
      - "apps/web/src/components/settings/BrowserProxySetting.tsx"
      - "packages/contracts/src/browserProxy*"
      - "evals/mcp-tool-use/cases/browser-proxy.ndjson"

permissions:
  contents: read

concurrency:
  group: browser-proxy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'e-kotov/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout without vendored gitlinks
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags origin main "$CHECKOUT_REF"
          git checkout --detach "$CHECKOUT_REF"
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
      - name: Check fork footprint
        run: python3 scripts/fork-footprint-budget.py
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - run: vp install
      - name: Install Chromium for real proxy routing tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prove routing and lifecycle regressions against the reviewed revision
        run: |
          sources=(apps/server/src/preview/BrowserProxyContexts.ts apps/server/src/preview/browserProxyOpen.ts packages/contracts/src/settings.ts apps/web/src/browser/useOpenLink.ts)
          for index in "${!sources[@]}"; do cp "${sources[$index]}" "$RUNNER_TEMP/proxy-source-$index"; done
          restore() {
            for index in "${!sources[@]}"; do cp "$RUNNER_TEMP/proxy-source-$index" "${sources[$index]}"; done
          }
          trap restore EXIT
          for source in "${sources[@]}"; do git show "6efea0ea2179bac74f65f54565c15aa5c580fb60:$source" > "$source"; done
          if vp test run apps/server/src/preview/BrowserProxyContexts.test.ts apps/server/src/preview/browserProxyOpen.test.ts packages/contracts/src/browserProxy.test.ts apps/web/src/browser/useOpenLink.proxy.test.ts -t 'waits for all route deletion|releases idle route browsers|does not reuse a tab|keeps local and signed|stores defaults only|keeps an explicitly selected tab|does not open the system browser' --reporter=json --outputFile="$RUNNER_TEMP/proxy-regressions.json"; then
            echo 'The seven regressions must fail on the reviewed revision.'
            exit 1
          fi
          python3 - <<'PYTHON'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'proxy-regressions.json').read_text())
          failed = [case for suite in result['testResults'] for case in suite.get('assertionResults', []) if case['status'] == 'failed']
          assert result['numFailedTests'] == len(failed) == 7, result
          names = ['waits for all route deletion', 'releases idle route browsers', 'does not reuse a tab', 'keeps local and signed', 'stores defaults only', 'keeps an explicitly selected tab', 'does not open the system browser']
          for name in names:
              cases = [case for case in failed if name in case['fullName']]
              assert len(cases) == 1, failed
              assert any(term in '\n'.join(cases[0]['failureMessages']) for term in ['AssertionError', 'ENOENT']), cases
          PYTHON
      - name: Check changed code
        run: vp run check:changed origin/main
      - name: Validate proxy agent eval cases without paid calls
        working-directory: evals
        run: node mcp-tool-use/run.ts --case browser-proxy-request,browser-direct-request --dry-run > "$RUNNER_TEMP/proxy-evals.jsonl"
      - name: Capture formatting fixes
        if: failure()
        run: |
          git diff --name-only --diff-filter=AM -z origin/main HEAD |
            xargs -0 -r vp fmt --no-error-on-unmatched-pattern
          git diff --binary > "$RUNNER_TEMP/browser-proxy-format.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: browser-proxy-format-fixes
          path: ${{ runner.temp }}/browser-proxy-format.patch
          retention-days: 3
