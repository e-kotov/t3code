name: Build Fork Android Tailscale Engine
description: Restore or cross-compile libt3tailnet.so and optionally run Go engine checks.
inputs:
  verify-go:
    description: Run Go race tests and go.mod/go.sum tidy checks even when libt3tailnet.so is cached
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Resolve Android NDK compiler fingerprint
      id: ndk
      shell: bash
      run: |
        set -euo pipefail
        ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
        [[ -d "$ndk" ]] || { echo "Set ANDROID_NDK_HOME to an Android NDK." >&2; exit 1; }
        host="$(uname -s | tr '[:upper:]' '[:lower:]')-x86_64"
        cc="$ndk/toolchains/llvm/prebuilt/$host/bin/aarch64-linux-android24-clang"
        [[ -x "$cc" ]] || { echo "No NDK compiler at $cc" >&2; exit 1; }
        hash="$("$cc" --version | sha256sum | cut -d' ' -f1)"
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Cache built Android Tailscale library
      id: tailnet_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: apps/mobile/modules/t3-tailnet/android/src/main/jniLibs/arm64-v8a/libt3tailnet.so
        key: fork-tailnet-so-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ndk.outputs.hash }}-${{ hashFiles('apps/mobile/modules/t3-tailnet/go/**', 'scripts/build-tailnet-android.sh', '.github/actions/build-fork-tailnet/**') }}

    - name: Setup Go
      if: steps.tailnet_cache.outputs.cache-hit != 'true' || inputs.verify-go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: apps/mobile/modules/t3-tailnet/go/go.mod
        cache-dependency-path: apps/mobile/modules/t3-tailnet/go/go.sum

    - name: Test the Tailscale engine
      if: steps.tailnet_cache.outputs.cache-hit != 'true' || inputs.verify-go == 'true'
      shell: bash
      working-directory: apps/mobile/modules/t3-tailnet/go
      env:
        VERIFY_GO: ${{ inputs.verify-go }}
      run: |
        set -euo pipefail
        if [[ "$VERIFY_GO" == "true" ]]; then
          go test -mod=readonly -race ./...
          go mod tidy
          git diff --exit-code -- go.mod go.sum
        else
          go test ./...
        fi

    - name: Build the Android Tailscale library
      if: steps.tailnet_cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/build-tailnet-android.sh

    - name: Verify Android Tailscale library exists
      shell: bash
      run: test -s apps/mobile/modules/t3-tailnet/android/src/main/jniLibs/arm64-v8a/libt3tailnet.so
